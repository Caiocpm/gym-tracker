name: gym_tracker
description: Kinify — app mobile para acompanhamento de treinos
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navegação
  go_router: ^14.2.7

  # HTTP / API
  dio: ^5.4.3+1

  # Banco de dados local (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Armazenamento de tokens (shared_preferences para dev Windows; trocar por flutter_secure_storage em prod)
  shared_preferences: ^2.3.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Gráficos
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2

  # Utilitários
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0

  # Geolocalização
  geolocator: ^13.0.2

  # Reconhecimento de voz
  speech_to_text: ^7.0.0

  # Manter tela acesa durante treinos
  wakelock_plus: ^1.3.4

  # Notificações locais (lembrete de água)
  flutter_local_notifications: ^18.0.1

  # Story card — compartilhar treino
  pasteboard: ^0.5.0
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
